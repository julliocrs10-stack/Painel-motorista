name: Gerar APK

on:
  push:
    branches: [main]
    paths:
      - 'projeto-android.zip'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Descompactar o projeto Android
        run: unzip -q -o projeto-android.zip

      - name: Copiar o painel (index.html) para dentro do app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar arquivo do APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk painel-motorista.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Painel Motorista (APK mais recente)
          body: "Baixe o arquivo painel-motorista.apk e instale no celular. Cada build novo substitui este."
          files: painel-motorista.apk
          make_latest: true
